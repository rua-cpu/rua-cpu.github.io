<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello — Rua's Pages</title>
  <style>
    :root { --bg:#f7f8fa; --text:#1a1d21; --muted:#6b7280; --accent:#2f6f5e; --card:#fff; --border:#e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --text:#e8eaed; --muted:#9aa0a6; --accent:#4db699; --card:#171a21; --border:#2a2e37; }
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Roboto, sans-serif;
      background:var(--bg); color:var(--text); padding:24px;
    }
    .box { max-width:520px; text-align:center; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:48px 40px; box-shadow:0 4px 24px rgba(0,0,0,.06); }
    .emoji { font-size:56px; }
    h1 { font-size:28px; margin:16px 0 8px; letter-spacing:-0.02em; }
    p { color:var(--muted); margin:0 0 24px; line-height:1.6; }
    code { background:rgba(127,127,127,.12); padding:3px 8px; border-radius:6px; font-family:ui-monospace, Menlo, monospace; font-size:14px; color:var(--accent); }
    a.back { display:inline-block; margin-top:20px; color:var(--accent); text-decoration:none; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">👋</div>
    <h1>배포 성공!</h1>
    <p>이 페이지는 <code>hello/</code> 폴더에 있고,<br>주소는 <code>/hello/</code> 입니다.<br>이렇게 폴더 하나가 개별 사이트가 됩니다.</p>
    <a class="back" href="../">← 전체 페이지 목록</a>
  </div>
</body>
</html>

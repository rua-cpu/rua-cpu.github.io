<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rua's Pages</title>
  <meta name="description" content="cowork에서 만든 페이지 모음" />
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2f6f5e;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #2a2e37;
        --accent: #4db699;
        --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 96px; }
    header { margin-bottom: 40px; }
    h1 { font-size: 32px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 15px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform .12s ease, border-color .12s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    .card p { font-size: 14px; color: var(--muted); margin: 0 0 14px; min-height: 20px; }
    .card .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .card .url { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .empty { color: var(--muted); font-size: 15px; padding: 40px 0; text-align: center; border: 1px dashed var(--border); border-radius: 14px; }
    footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Rua's Pages</h1>
      <p class="sub">cowork에서 만든 페이지 모음 · 카드를 눌러 열어보세요</p>
    </header>
    <div class="grid" id="grid"></div>
    <footer>
      <span id="count"></span> · <a href="https://github.com/rua-cpu/rua-cpu.github.io">GitHub 저장소</a>
    </footer>
  </div>

  <script>
    /* ─────────────────────────────────────────────────────────────
       새 페이지를 추가하려면 아래 배열에 항목 하나만 추가하세요.
       slug = 폴더 이름 = URL 경로.  예) slug:"invoice" → /invoice/
       ───────────────────────────────────────────────────────────── */
    const pages = [
      { slug: "sp59-money-rv-analysis", title: "💰 SP59 재화 RV Step 분석", desc: "재화 RV 요청→완료 단계별 분석", date: "2026-07-28" },
      { slug: "pizza-ready-audit", title: "🍕 Pizza Ready 프로세스 점검", desc: "A→Z 작업 프로세스 점검 + UI 피드백 개선안", date: "2026-07-28" },
      { slug: "forge3-2", title: "⚒️ Forge 3.2 퍼널 분석", desc: "3.2(SP1) AOS · 2.4 버전 비교", date: "2026-07-28" },
      { slug: "puzzle-report", title: "🧩 퍼즐 게임 리포트 (인터랙티브)", desc: "CSV를 올려 데이터를 바꿔볼 수 있는 지표 대시보드", date: "2026-07-21" },
      { slug: "puzzle-report-static", title: "🧩 퍼즐 게임 리포트 (정적)", desc: "고정 데이터 스냅샷 · 열람 전용", date: "2026-07-21" },
    ];

    const grid = document.getElementById("grid");
    if (pages.length === 0) {
      grid.outerHTML = '<div class="empty">아직 페이지가 없어요. 첫 페이지를 배포해보세요.</div>';
    } else {
      // 최신 날짜가 위로 오도록 정렬
      pages.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      grid.innerHTML = pages.map(p => `
        <a class="card" href="./${p.slug}/">
          <h2>${p.title}</h2>
          <p>${p.desc || ""}</p>
          <div class="meta">
            <span class="url">/${p.slug}/</span>
            <span>${p.date || ""}</span>
          </div>
        </a>`).join("");
    }
    document.getElementById("count").textContent = pages.length + "개 페이지";
  </script>
</body>
</html>
